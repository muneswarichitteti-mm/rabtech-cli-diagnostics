[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-cli-diagnostics"
version = "0.1.0"
description = "CLI diagnostics tool for developer environments"
readme = "README.txt"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diag = "diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
